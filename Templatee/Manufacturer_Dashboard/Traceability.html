<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSure - Traceability</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { background: '#FFFFFF', ink: { 900: '#000000', 500: '#86868B', 200: '#E5E5EA' }, brand: { 500: '#00D15E' } } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #FAFAFA; color: #000000; -webkit-font-smoothing: antialiased; }
        .tap-effect:active { transform: scale(0.96); opacity: 0.7; }
        .fade-up { opacity: 0; transform: translateY(12px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-up.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="pb-28 lg:pb-0 lg:bg-[#FAFAFA]">

    <div class="lg:flex lg:max-w-7xl lg:mx-auto lg:h-screen">
        <aside class="hidden lg:flex flex-col w-64 border-r border-ink-200 bg-white h-full fixed left-0 top-0 pt-12 px-8 pb-8 z-50">
            <div class="mb-12"><h2 class="text-2xl font-bold tracking-tight">EcoSure</h2></div>
            <nav class="flex-1 space-y-4">
                <a href="Dashboard.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Overview</a>
                <a href="Traceability.html" class="flex items-center gap-3 text-ink-900 font-semibold px-4 py-3 bg-ink-200/40 rounded-xl"><i data-lucide="scan-barcode" class="w-5 h-5"></i> Traceability</a>
                <a href="Marketplace.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="shopping-cart" class="w-5 h-5"></i> Marketplace</a>
                <a href="Compliance.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="award" class="w-5 h-5"></i> Compliance</a>
            </nav>
        </aside>

        <main class="lg:ml-64 flex-1 p-6 lg:p-12 min-h-screen">
            <header class="mb-10 fade-up">
                <p class="text-sm font-medium text-ink-500 uppercase tracking-widest mb-1">Product Lifecycle</p>
                <h1 class="text-4xl font-semibold tracking-tight">Traceability</h1>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Registration Form -->
                <div class="lg:col-span-1 bg-white p-6 rounded-3xl border border-ink-200 shadow-sm fade-up delay-100">
                    <h3 class="font-bold text-lg mb-4">Register New Batch</h3>
                    <p class="text-sm text-ink-500 mb-6">Log devices entering the market to track their eventual return.</p>
                    <form id="productForm" class="space-y-4" onsubmit="handleRegisterSubmit(event)">
                        <div>
                            <label class="block text-xs font-medium text-ink-500 mb-1">Serial Number</label>
                            <input type="text" id="serialNumber" required class="w-full px-3 py-2 border border-ink-200 rounded-lg text-sm bg-gray-50 placeholder-gray-400" placeholder="e.g. SN-9982X">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-ink-500 mb-1">Product Model</label>
                            <input type="text" id="productModel" required class="w-full px-3 py-2 border border-ink-200 rounded-lg text-sm bg-gray-50 placeholder-gray-400" placeholder="e.g. ThinkPad T14">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-ink-500 mb-1">Weight (kg)</label>
                            <input type="number" step="0.01" id="weightKg" required class="w-full px-3 py-2 border border-ink-200 rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-ink-500 mb-1">Category</label>
                            <select id="category" class="w-full px-3 py-2 border border-ink-200 rounded-lg text-sm bg-gray-50">
                                <option value="itew_computers_laptops">IT & Telecommunication (Laptops/PCs)</option>
                                <option value="itew_mobile_phones">Mobile Phones</option>
                                <option value="cee_consumer_electronics">Consumer Electronics</option>
                                <option value="cee_air_conditioners_refrigerators">ACs & Refrigerators</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-ink-900 text-white font-medium py-2 rounded-xl mt-4 tap-effect hover:bg-black transition-colors">Register Device</button>
                    </form>
                </div>

                <!-- Products Table -->
                <div class="lg:col-span-2 bg-white rounded-3xl border border-ink-200 shadow-sm overflow-hidden fade-up delay-200">
                    <div class="p-6 border-b border-ink-200 flex justify-between items-center">
                        <h3 class="font-bold text-lg">Manufactured Devices</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs text-ink-500 uppercase bg-ink-200/20">
                                <tr>
                                    <th class="px-6 py-4 font-semibold tracking-wider">Serial No</th>
                                    <th class="px-6 py-4 font-semibold tracking-wider">Model</th>
                                    <th class="px-6 py-4 font-semibold tracking-wider">Weight</th>
                                    <th class="px-6 py-4 font-semibold tracking-wider">Status</th>
                                </tr>
                            </thead>
                            <tbody id="productsList" class="divide-y divide-ink-200">
                                <!-- Injected rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Nav omitted for brevity, identical structure -->
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.fade-up').forEach((el, i) => setTimeout(() => el.classList.add('active'), i * 50));
            lucide.createIcons();
            loadProducts();
        });

        async function loadProducts() {
            try {
                const token = localStorage.getItem('ecosure_jwt');
                const res = await fetch('/api/manufacturer/products', { headers: { 'Authorization': `Bearer ${token}` }});
                const json = await res.json();
                
                const list = document.getElementById('productsList');
                list.innerHTML = '';
                
                if (json.success && json.data.length > 0) {
                    json.data.forEach(p => {
                        let statusColor = 'bg-blue-100 text-blue-800'; // active
                        if(p.lifecycle_status === 'collected') statusColor = 'bg-orange-100 text-orange-800';
                        if(p.lifecycle_status === 'recycled') statusColor = 'bg-green-100 text-green-800';

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="px-6 py-4 font-mono font-medium">${p.serial_number}</td>
                            <td class="px-6 py-4">${p.product_model}</td>
                            <td class="px-6 py-4 font-mono">${p.weight_kg} kg</td>
                            <td class="px-6 py-4">
                                <span class="px-2.5 py-1 text-[10px] font-bold rounded-full uppercase ${statusColor}">
                                    ${p.lifecycle_status}
                                </span>
                            </td>
                        `;
                        list.appendChild(row);
                    });
                } else {
                    list.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-ink-500">No products registered yet.</td></tr>`;
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const payload = {
                serialNumber: document.getElementById('serialNumber').value,
                productModel: document.getElementById('productModel').value,
                weightKg: document.getElementById('weightKg').value,
                category: document.getElementById('category').value
            };
            try {
                const token = localStorage.getItem('ecosure_jwt');
                const res = await fetch(`/api/manufacturer/products`, { 
                    method: 'POST', 
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await res.json();
                if(json.success) {
                    e.target.reset();
                    loadProducts();
                } else {
                    alert('Error registering product: ' + json.message);
                }
            } catch (err) {
                console.error(err);
                alert('Request failed');
            }
        }
    </script>
</body>
</html>
