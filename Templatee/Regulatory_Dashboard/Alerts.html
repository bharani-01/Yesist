<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSure - Fraud Alerts</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { background: '#FFFFFF', ink: { 900: '#000000', 500: '#86868B', 200: '#E5E5EA' }, brand: { 500: '#00D15E', alert: '#FF3B30' } } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #FAFAFA; color: #000000; -webkit-font-smoothing: antialiased; }
        .tap-effect:active { transform: scale(0.96); opacity: 0.7; }
        .fade-up { opacity: 0; transform: translateY(12px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-up.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="pb-28 lg:pb-0 lg:bg-[#FAFAFA]">

    <div class="lg:flex lg:max-w-7xl lg:mx-auto lg:h-screen">
        <aside class="hidden lg:flex flex-col w-64 border-r border-ink-200 bg-white h-full fixed left-0 top-0 pt-12 px-8 pb-8 z-50">
            <div class="mb-12"><h2 class="text-2xl font-bold tracking-tight">EcoSure Govt</h2></div>
            <nav class="flex-1 space-y-4">
                <a href="Dashboard.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Command Center</a>
                <a href="Analytics.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="bar-chart-3" class="w-5 h-5"></i> E-Waste Flow</a>
                <a href="Compliance.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="factory" class="w-5 h-5"></i> OEM Compliance</a>
                <a href="Alerts.html" class="flex items-center gap-3 text-red-600 font-semibold px-4 py-3 bg-red-50 rounded-xl"><i data-lucide="shield-alert" class="w-5 h-5"></i> Fraud Alerts</a>
                <a href="Custody.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="search" class="w-5 h-5"></i> Trace UID</a>
            </nav>
        </aside>

        <main class="lg:ml-64 flex-1 p-6 lg:p-12 min-h-screen">
            <header class="mb-10 fade-up">
                <p class="text-sm font-medium text-red-500 uppercase tracking-widest mb-1">Anomaly Detection Engine</p>
                <h1 class="text-4xl font-semibold tracking-tight">Fraud Alerts</h1>
            </header>

            <div class="bg-white rounded-3xl border border-red-200 shadow-sm overflow-hidden fade-up delay-100">
                <div class="p-6 border-b border-red-200 flex justify-between items-center bg-red-50">
                    <h3 class="font-bold text-lg text-red-600 flex items-center gap-2"><i data-lucide="alert-triangle" class="w-5 h-5"></i> Active Anomalies</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-ink-500 uppercase bg-ink-200/20">
                            <tr>
                                <th class="px-6 py-4 font-semibold tracking-wider">Date</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">Severity</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">Alert Type</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">Description</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">Manifest UID</th>
                            </tr>
                        </thead>
                        <tbody id="alertsList" class="divide-y divide-ink-200">
                            <!-- Injected rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.fade-up').forEach((el, i) => setTimeout(() => el.classList.add('active'), i * 50));
            lucide.createIcons();
            loadAlerts();
        });

        async function loadAlerts() {
            try {
                const token = localStorage.getItem('ecosure_jwt');
                const res = await fetch('/api/regulatory/alerts', { headers: { 'Authorization': `Bearer ${token}` }});
                const json = await res.json();
                
                const list = document.getElementById('alertsList');
                list.innerHTML = '';
                
                if (json.success && json.data.length > 0) {
                    json.data.forEach(a => {
                        const dateObj = new Date(a.created_at);
                        const severityClass = a.severity === 'high' ? 'bg-red-100 text-red-800' : 
                                              a.severity === 'critical' ? 'bg-black text-red-500' : 'bg-orange-100 text-orange-800';

                        const row = document.createElement('tr');
                        row.className = "hover:bg-red-50 cursor-pointer transition-colors";
                        if(a.manifest?.manifest_number) {
                            row.onclick = () => window.location.href = `Custody.html?uid=${a.manifest.manifest_number}`;
                        }

                        row.innerHTML = `
                            <td class="px-6 py-4 font-medium text-ink-500">${dateObj.toLocaleDateString()}</td>
                            <td class="px-6 py-4"><span class="px-2.5 py-1 text-[10px] font-bold rounded-full uppercase ${severityClass}">${a.severity}</span></td>
                            <td class="px-6 py-4 font-bold">${a.alert_type}</td>
                            <td class="px-6 py-4 text-ink-500">${a.description}</td>
                            <td class="px-6 py-4 font-mono font-medium">${a.manifest?.manifest_number || 'N/A'}</td>
                        `;
                        list.appendChild(row);
                    });
                } else {
                    list.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-ink-500">No fraud alerts detected. System is operating normally.</td></tr>`;
                }
            } catch (error) {
                console.error(error);
            }
        }
    </script>
</body>
</html>
