<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSure - Recycler Shipments</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { background: '#FFFFFF', ink: { 900: '#000000', 500: '#86868B', 200: '#E5E5EA' }, brand: { 500: '#00D15E' } }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #FAFAFA; color: #000000; -webkit-font-smoothing: antialiased; }
        .tap-effect:active { transform: scale(0.96); opacity: 0.7; }
        .fade-up { opacity: 0; transform: translateY(12px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-up.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="pb-28 lg:pb-0 lg:bg-[#FAFAFA]">

    <!-- Sidebar and Header (Simplified for template) -->
    <div class="lg:flex lg:max-w-7xl lg:mx-auto lg:h-screen">
        <aside class="hidden lg:flex flex-col w-64 border-r border-ink-200 bg-white h-full fixed left-0 top-0 pt-12 px-8 pb-8 z-50">
            <div class="mb-12"><h2 class="text-2xl font-bold tracking-tight">EcoSure</h2></div>
            <nav class="flex-1 space-y-4">
                <a href="Dashboard.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Overview</a>
                <a href="Shipments.html" class="flex items-center gap-3 text-ink-900 font-semibold px-4 py-3 bg-ink-200/40 rounded-xl"><i data-lucide="truck" class="w-5 h-5"></i> Shipments</a>
                <a href="Recovery.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="recycle" class="w-5 h-5"></i> Recovery Log</a>
                <a href="Certificates.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="award" class="w-5 h-5"></i> Certificates</a>
            </nav>
        </aside>

        <main class="lg:ml-64 flex-1 p-6 lg:p-12 min-h-screen">
            <header class="mb-10 fade-up">
                <p class="text-sm font-medium text-ink-500 uppercase tracking-widest mb-1">Incoming</p>
                <h1 class="text-4xl font-semibold tracking-tight">Shipments</h1>
            </header>

            <div class="bg-white rounded-3xl border border-ink-200 shadow-sm overflow-hidden fade-up delay-100">
                <div class="p-6 border-b border-ink-200 flex justify-between items-center">
                    <h3 class="font-bold text-lg">Inbound Manifests</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-ink-500 uppercase bg-ink-200/20">
                            <tr>
                                <th class="px-6 py-4 font-semibold tracking-wider">Manifest</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">Hub Source</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">Net Wt</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">Status</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">Action</th>
                            </tr>
                        </thead>
                        <tbody id="shipmentsList" class="divide-y divide-ink-200">
                            <!-- Injected rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.fade-up').forEach((el, i) => setTimeout(() => el.classList.add('active'), i * 50));
            lucide.createIcons();
            loadShipments();
        });

        async function loadShipments() {
            try {
                const token = localStorage.getItem('ecosure_jwt');
                const res = await fetch('/api/recycler/shipments', { headers: { 'Authorization': `Bearer ${token}` }});
                const json = await res.json();
                
                const list = document.getElementById('shipmentsList');
                list.innerHTML = '';
                
                if (json.success && json.data.length > 0) {
                    json.data.forEach(s => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="px-6 py-4 font-medium">${s.manifest_number}</td>
                            <td class="px-6 py-4">${s.aggregator?.hub_name || 'N/A'}</td>
                            <td class="px-6 py-4 font-mono font-semibold">${s.net_weight_kg} kg</td>
                            <td class="px-6 py-4">
                                <span class="px-2.5 py-1 text-xs font-medium rounded-full ${
                                    s.status === 'in_transit' ? 'bg-orange-100 text-orange-800' : 
                                    (s.status === 'processed' ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800')
                                }">${s.status.replace(/_/g, ' ').toUpperCase()}</span>
                            </td>
                            <td class="px-6 py-4">
                                ${s.status === 'in_transit' ? 
                                `<button onclick="verifyShipment('${s.id}')" class="px-3 py-1 bg-ink-900 text-white rounded text-xs tap-effect">Verify</button>` 
                                : '-'}
                            </td>
                        `;
                        list.appendChild(row);
                    });
                } else {
                    list.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-ink-500">No shipments found.</td></tr>`;
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function verifyShipment(id) {
            if(!confirm('Mark this shipment as received and verified?')) return;
            try {
                const token = localStorage.getItem('ecosure_jwt');
                await fetch(`/api/recycler/shipments/${id}/verify`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }});
                loadShipments();
            } catch (err) {
                console.error(err);
                alert('Verification failed');
            }
        }
    </script>
</body>
</html>
