<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSure - Material Recovery</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { background: '#FFFFFF', ink: { 900: '#000000', 500: '#86868B', 200: '#E5E5EA' }, brand: { 500: '#00D15E' } } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #FAFAFA; color: #000000; -webkit-font-smoothing: antialiased; }
        .tap-effect:active { transform: scale(0.96); opacity: 0.7; }
        .fade-up { opacity: 0; transform: translateY(12px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-up.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="pb-28 lg:pb-0 lg:bg-[#FAFAFA]">
    <div class="lg:flex lg:max-w-7xl lg:mx-auto lg:h-screen">
        <aside class="hidden lg:flex flex-col w-64 border-r border-ink-200 bg-white h-full fixed left-0 top-0 pt-12 px-8 pb-8 z-50">
            <div class="mb-12"><h2 class="text-2xl font-bold tracking-tight">EcoSure</h2></div>
            <nav class="flex-1 space-y-4">
                <a href="Dashboard.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Overview</a>
                <a href="Shipments.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="truck" class="w-5 h-5"></i> Shipments</a>
                <a href="Recovery.html" class="flex items-center gap-3 text-ink-900 font-semibold px-4 py-3 bg-ink-200/40 rounded-xl"><i data-lucide="recycle" class="w-5 h-5"></i> Recovery Log</a>
                <a href="Certificates.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="award" class="w-5 h-5"></i> Certificates</a>
            </nav>
        </aside>

        <main class="lg:ml-64 flex-1 p-6 lg:p-12 min-h-screen">
            <header class="mb-10 fade-up">
                <p class="text-sm font-medium text-ink-500 uppercase tracking-widest mb-1">Processing</p>
                <h1 class="text-4xl font-semibold tracking-tight">Material Recovery</h1>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Log Form -->
                <div class="lg:col-span-1 bg-white p-6 rounded-3xl border border-ink-200 shadow-sm fade-up delay-100">
                    <h3 class="font-bold text-lg mb-4">Log Batch Recovery</h3>
                    <form id="recoveryForm" class="space-y-4" onsubmit="handleRecoverySubmit(event)">
                        <div>
                            <label class="block text-xs font-medium text-ink-500 mb-1">Manifest ID</label>
                            <input type="text" id="manifestId" required class="w-full px-3 py-2 border border-ink-200 rounded-lg text-sm bg-gray-50 placeholder-gray-400" placeholder="UUID of shipment">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-ink-500 mb-1">Copper (kg)</label>
                                <input type="number" step="0.01" id="copperKg" class="w-full px-3 py-2 border border-ink-200 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-ink-500 mb-1">Lithium (kg)</label>
                                <input type="number" step="0.01" id="lithiumKg" class="w-full px-3 py-2 border border-ink-200 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-ink-500 mb-1">Aluminum (kg)</label>
                                <input type="number" step="0.01" id="aluminumKg" class="w-full px-3 py-2 border border-ink-200 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-ink-500 mb-1">PCBs (kg)</label>
                                <input type="number" step="0.01" id="pcbKg" class="w-full px-3 py-2 border border-ink-200 rounded-lg text-sm">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-brand-500 text-white font-medium py-2 rounded-xl mt-4 tap-effect hover:bg-green-600 transition-colors">Save Log</button>
                    </form>
                </div>

                <!-- Recovery Log Table -->
                <div class="lg:col-span-2 bg-white rounded-3xl border border-ink-200 shadow-sm overflow-hidden fade-up delay-200">
                    <div class="p-6 border-b border-ink-200 flex justify-between items-center">
                        <h3 class="font-bold text-lg">Recent Logs</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs text-ink-500 uppercase bg-ink-200/20">
                                <tr>
                                    <th class="px-6 py-4 font-semibold">Batch</th>
                                    <th class="px-6 py-4 font-semibold">Manifest</th>
                                    <th class="px-6 py-4 font-semibold">Copper</th>
                                    <th class="px-6 py-4 font-semibold">Total Recovered</th>
                                </tr>
                            </thead>
                            <tbody id="logsList" class="divide-y divide-ink-200">
                                <!-- Injected rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.fade-up').forEach((el, i) => setTimeout(() => el.classList.add('active'), i * 50));
            lucide.createIcons();
            loadLogs();
        });

        async function loadLogs() {
            try {
                const token = localStorage.getItem('ecosure_jwt');
                const res = await fetch('/api/recycler/recovery', { headers: { 'Authorization': `Bearer ${token}` }});
                const json = await res.json();
                
                const list = document.getElementById('logsList');
                list.innerHTML = '';
                
                if (json.success && json.data.length > 0) {
                    json.data.forEach(s => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="px-6 py-4 font-medium">${s.batch_number}</td>
                            <td class="px-6 py-4 text-ink-500">${s.manifest?.manifest_number || 'Unknown'}</td>
                            <td class="px-6 py-4 font-mono">${s.copper_kg} kg</td>
                            <td class="px-6 py-4 font-mono font-semibold text-brand-500">${s.total_recovered_kg} kg</td>
                        `;
                        list.appendChild(row);
                    });
                } else {
                    list.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-ink-500">No logs found.</td></tr>`;
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function handleRecoverySubmit(e) {
            e.preventDefault();
            const payload = {
                manifestId: document.getElementById('manifestId').value,
                copperKg: document.getElementById('copperKg').value || 0,
                lithiumKg: document.getElementById('lithiumKg').value || 0,
                aluminumKg: document.getElementById('aluminumKg').value || 0,
                pcbKg: document.getElementById('pcbKg').value || 0
            };
            try {
                const token = localStorage.getItem('ecosure_jwt');
                const res = await fetch(`/api/recycler/recovery`, { 
                    method: 'POST', 
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await res.json();
                if(json.success) {
                    alert('Log saved successfully!');
                    e.target.reset();
                    loadLogs();
                } else {
                    alert('Error saving log: ' + json.message);
                }
            } catch (err) {
                console.error(err);
                alert('Request failed');
            }
        }
    </script>
</body>
</html>
