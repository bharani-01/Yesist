<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSure - Shop Collections</title>
    
    <!-- SOTA Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#F0FDF4', 100: '#DCFCE7', 500: '#22C55E', 600: '#16A34A', 900: '#14532D' },
                        ink: { 50: '#F9FAFB', 200: '#E5E7EB', 500: '#6B7280', 900: '#111827' }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #F9FAFB;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(229, 231, 235, 0.5);
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .tap-effect:active { transform: scale(0.96); transition: transform 0.1s; }
        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUpAnim 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeUpAnim {
            to { opacity: 1; transform: translateY(0); }
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
    </style>
</head>
<body class="text-ink-900 antialiased overflow-x-hidden selection:bg-brand-500 selection:text-white">

    <div class="min-h-screen flex flex-col lg:flex-row max-w-7xl mx-auto lg:pl-64">
        
        <!-- Desktop Sidebar -->
        <aside class="hidden lg:flex flex-col w-64 border-r border-ink-200 bg-white h-full fixed left-0 top-0 pt-12 px-8 pb-8 z-50">
            <div class="mb-12">
                <h2 class="text-2xl font-bold tracking-tight text-ink-900 flex items-center gap-2">
                    <i data-lucide="store" class="w-6 h-6"></i> Shop
                </h2>
            </div>
            
            <nav class="flex-1 space-y-4">
                <a href="Dashboard.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium tap-effect px-4 py-3 rounded-xl transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>
                <a href="Collections.html" class="flex items-center gap-3 text-ink-900 font-semibold tap-effect px-4 py-3 bg-ink-200/40 rounded-xl">
                    <i data-lucide="package-check" class="w-5 h-5"></i> Collections
                </a>
                <a href="Settings.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium tap-effect px-4 py-3 rounded-xl transition-colors">
                    <i data-lucide="settings" class="w-5 h-5"></i> Store Settings
                </a>
            </nav>

            <button onclick="logout()" class="flex items-center gap-3 text-red-500 hover:bg-red-50 font-medium tap-effect px-4 py-3 rounded-xl transition-colors mt-auto">
                <i data-lucide="log-out" class="w-5 h-5"></i> Sign Out
            </button>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 w-full pb-28 lg:pb-12 pt-8 lg:pt-12 px-0 lg:px-12 relative z-10">
            
            <!-- Mobile Header -->
            <header class="lg:hidden flex items-center justify-between px-6 mb-8 fade-up">
                <div>
                    <p class="text-sm font-medium text-ink-500 mb-0.5">Recycle Shop</p>
                    <h1 class="text-2xl font-bold tracking-tight text-ink-900">Collections</h1>
                </div>
            </header>

            <!-- Desktop Header -->
            <header class="hidden lg:flex items-center justify-between mb-12 fade-up">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight text-ink-900 mb-1">Collections History</h1>
                    <p class="text-ink-500">All received e-waste packages.</p>
                </div>
            </header>

            <!-- Main Content Container -->
            <div class="px-6 lg:px-0 space-y-8 fade-up delay-100">
                <section class="bg-white lg:p-8 lg:rounded-3xl lg:border lg:border-ink-200 lg:shadow-sm">
                    <div id="collectionsList" class="space-y-4">
                        <div class="text-center py-12">
                            <div class="w-16 h-16 bg-ink-200/30 rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse"></div>
                            <p class="text-ink-500">Loading collections...</p>
                        </div>
                    </div>
                </section>
            </div>

        </main>

        <!-- Mobile Bottom Navigation -->
        <nav class="lg:hidden fixed bottom-0 w-full glass-nav pb-safe pt-3 px-6 z-50">
            <div class="flex justify-around items-center w-full max-w-md mx-auto pb-6">
                <a href="Dashboard.html" class="flex flex-col items-center gap-1 tap-effect w-16 group opacity-50">
                    <i data-lucide="home" class="w-6 h-6 text-ink-900"></i>
                    <span class="text-[10px] font-medium text-ink-900">Home</span>
                </a>
                <a href="Collections.html" class="flex flex-col items-center gap-1 tap-effect w-16">
                    <i data-lucide="package-check" class="w-6 h-6 text-ink-900"></i>
                    <span class="text-[10px] font-semibold text-ink-900">Jobs</span>
                </a>
                <div class="relative -top-5">
                    <button onclick="window.location.href='Dashboard.html'" class="w-12 h-12 rounded-full bg-brand-500 text-white flex items-center justify-center shadow-lg tap-effect">
                        <i data-lucide="scan-line" class="w-5 h-5"></i>
                    </button>
                </div>
                <a href="Settings.html" class="flex flex-col items-center gap-1 tap-effect w-16 group opacity-50">
                    <i data-lucide="settings" class="w-6 h-6 text-ink-900"></i>
                    <span class="text-[10px] font-medium text-ink-900">Store</span>
                </a>
            </div>
        </nav>
    </div>

    <script>
        lucide.createIcons();

        async function loadCollections() {
            try {
                const token = localStorage.getItem('ecosure_jwt');
                if (!token) return window.location.href = '../auth.html';

                const response = await fetch('/api/collector/collections', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 401 || response.status === 403) {
                    return window.location.href = '../auth.html';
                }

                const json = await response.json();
                if (json.success) {
                    renderCollections(json.data);
                } else {
                    document.getElementById('collectionsList').innerHTML = `<p class="text-red-500 text-center py-8">Error loading collections.</p>`;
                }
            } catch (error) {
                console.error(error);
                document.getElementById('collectionsList').innerHTML = `<p class="text-red-500 text-center py-8">Connection error.</p>`;
            }
        }

        function renderCollections(pickups) {
            const listEl = document.getElementById('collectionsList');
            listEl.innerHTML = '';

            if (!pickups || pickups.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-12 border-2 border-dashed border-ink-200 rounded-3xl">
                        <div class="w-16 h-16 bg-ink-200/30 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="package-search" class="w-8 h-8 text-ink-500"></i>
                        </div>
                        <h4 class="text-lg font-medium text-ink-900">No collections yet!</h4>
                        <p class="text-sm text-ink-500 mt-1 max-w-sm mx-auto">Your historical drop-offs will appear here once you scan packages.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            pickups.forEach((pickup) => {
                const consumerName = pickup.consumer_profiles?.full_name || 'Anonymous Consumer';
                const address = pickup.consumer_profiles?.address || 'Address not provided';
                
                let statusColor = "bg-ink-200/50 text-ink-500";
                let statusText = "Received";
                if(pickup.status === 'received_at_hub') {
                    statusColor = "bg-brand-500/10 text-brand-600";
                } else if(pickup.status === 'initiated') {
                    statusColor = "bg-yellow-500/10 text-yellow-600";
                    statusText = "Pending";
                }

                listEl.innerHTML += `
                    <div class="bg-white border border-ink-200 p-5 rounded-3xl shadow-sm transition-all hover:shadow-md mb-4">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex gap-4 items-center">
                                <div class="w-12 h-12 rounded-2xl bg-ink-900 flex items-center justify-center shrink-0">
                                    <i data-lucide="package" class="w-6 h-6 text-white"></i>
                                </div>
                                <div>
                                    <p class="font-semibold text-ink-900 tracking-tight">${pickup.manifest_number}</p>
                                    <p class="text-xs text-ink-500 mt-0.5">${pickup.category.replace(/_/g, ' ')} • ${pickup.gross_weight_kg} kg</p>
                                </div>
                            </div>
                            <span class="text-[10px] font-semibold px-2 py-1 rounded-full uppercase tracking-widest ${statusColor}">${statusText}</span>
                        </div>
                        
                        <div class="bg-[#FAFAFA] p-4 rounded-xl border border-ink-200">
                            <p class="text-sm font-medium text-ink-900 mb-1">${consumerName}</p>
                            <p class="text-xs text-ink-500 leading-relaxed flex items-start gap-1">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5 mt-0.5 shrink-0"></i>
                                ${address}
                            </p>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function logout() {
            localStorage.removeItem('ecosure_jwt');
            window.location.href = '../auth.html';
        }

        document.addEventListener('DOMContentLoaded', loadCollections);
    </script>
</body>
</html>
