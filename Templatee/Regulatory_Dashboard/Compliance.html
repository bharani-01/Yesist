<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSure - OEM Compliance</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { background: '#FFFFFF', ink: { 900: '#000000', 500: '#86868B', 200: '#E5E5EA' }, brand: { 500: '#00D15E', alert: '#FF3B30' } } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #FAFAFA; color: #000000; -webkit-font-smoothing: antialiased; }
        .tap-effect:active { transform: scale(0.96); opacity: 0.7; }
        .fade-up { opacity: 0; transform: translateY(12px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-up.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="pb-28 lg:pb-0 lg:bg-[#FAFAFA]">

    <div class="lg:flex lg:max-w-7xl lg:mx-auto lg:h-screen">
        <aside class="hidden lg:flex flex-col w-64 border-r border-ink-200 bg-white h-full fixed left-0 top-0 pt-12 px-8 pb-8 z-50">
            <div class="mb-12"><h2 class="text-2xl font-bold tracking-tight">EcoSure Govt</h2></div>
            <nav class="flex-1 space-y-4">
                <a href="Dashboard.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Command Center</a>
                <a href="Analytics.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="bar-chart-3" class="w-5 h-5"></i> E-Waste Flow</a>
                <a href="Compliance.html" class="flex items-center gap-3 text-ink-900 font-semibold px-4 py-3 bg-ink-200/40 rounded-xl"><i data-lucide="factory" class="w-5 h-5"></i> OEM Compliance</a>
                <a href="Alerts.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="shield-alert" class="w-5 h-5"></i> Fraud Alerts</a>
                <a href="Custody.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="search" class="w-5 h-5"></i> Trace UID</a>
            </nav>
        </aside>

        <main class="lg:ml-64 flex-1 p-6 lg:p-12 min-h-screen">
            <header class="mb-10 fade-up">
                <p class="text-sm font-medium text-ink-500 uppercase tracking-widest mb-1">EPR Surveillance</p>
                <h1 class="text-4xl font-semibold tracking-tight">OEM Compliance Tracker</h1>
            </header>

            <div class="bg-white rounded-3xl border border-ink-200 shadow-sm overflow-hidden fade-up delay-100">
                <div class="p-6 border-b border-ink-200 flex justify-between items-center bg-ink-900 text-white">
                    <h3 class="font-bold text-lg">National Deficit Monitor</h3>
                    <button class="px-4 py-2 bg-white/10 text-white rounded-lg text-sm font-medium tap-effect hover:bg-white/20">
                        Export Report
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-ink-500 uppercase bg-ink-200/20">
                            <tr>
                                <th class="px-6 py-4 font-semibold tracking-wider">Manufacturer</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">CPCB Reg No</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">EPR Category</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">Obligation (Tons)</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">Fulfilled (Tons)</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">Status</th>
                            </tr>
                        </thead>
                        <tbody id="complianceList" class="divide-y divide-ink-200">
                            <!-- Injected rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.fade-up').forEach((el, i) => setTimeout(() => el.classList.add('active'), i * 50));
            lucide.createIcons();
            loadCompliance();
        });

        async function loadCompliance() {
            try {
                const token = localStorage.getItem('ecosure_jwt');
                const res = await fetch('/api/regulatory/compliance', { headers: { 'Authorization': `Bearer ${token}` }});
                const json = await res.json();
                
                const list = document.getElementById('complianceList');
                list.innerHTML = '';
                
                if (json.success && json.data.length > 0) {
                    json.data.forEach(c => {
                        const target = Number(c.target_quantity_tons);
                        const achieved = Number(c.achieved_quantity_tons);
                        const percent = target > 0 ? (achieved / target) * 100 : 100;
                        
                        let statusHtml = '';
                        if(percent >= 100) {
                            statusHtml = `<span class="px-2.5 py-1 text-[10px] font-bold rounded-full uppercase bg-green-100 text-green-800">Compliant</span>`;
                        } else if(percent >= 50) {
                            statusHtml = `<span class="px-2.5 py-1 text-[10px] font-bold rounded-full uppercase bg-orange-100 text-orange-800">Deficit</span>`;
                        } else {
                            statusHtml = `<span class="px-2.5 py-1 text-[10px] font-bold rounded-full uppercase bg-red-100 text-red-800">Critical Deficit</span>`;
                        }

                        const row = document.createElement('tr');
                        row.className = "hover:bg-ink-200/10 transition-colors";
                        row.innerHTML = `
                            <td class="px-6 py-4 font-medium">${c.manufacturer?.company_name || 'N/A'}</td>
                            <td class="px-6 py-4 font-mono text-xs">${c.manufacturer?.cpcb_epr_reg_no || 'N/A'}</td>
                            <td class="px-6 py-4 text-xs uppercase">${c.category.replace(/_/g, ' ')}</td>
                            <td class="px-6 py-4 font-mono font-medium">${target.toFixed(2)}</td>
                            <td class="px-6 py-4 font-mono font-bold">${achieved.toFixed(2)}</td>
                            <td class="px-6 py-4">${statusHtml}</td>
                        `;
                        list.appendChild(row);
                    });
                } else {
                    list.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-ink-500">No EPR targets found in the registry.</td></tr>`;
                }
            } catch (error) {
                console.error(error);
            }
        }
    </script>
</body>
</html>
