<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSure - Shop Settings</title>
    
    <!-- SOTA Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#F0FDF4', 100: '#DCFCE7', 500: '#22C55E', 600: '#16A34A', 900: '#14532D' },
                        ink: { 50: '#F9FAFB', 200: '#E5E7EB', 500: '#6B7280', 900: '#111827' }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #F9FAFB;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(229, 231, 235, 0.5);
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .tap-effect:active { transform: scale(0.96); transition: transform 0.1s; }
        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUpAnim 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeUpAnim {
            to { opacity: 1; transform: translateY(0); }
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
    </style>
</head>
<body class="text-ink-900 antialiased overflow-x-hidden selection:bg-brand-500 selection:text-white">

    <div class="min-h-screen flex flex-col lg:flex-row max-w-7xl mx-auto lg:pl-64">
        
        <!-- Desktop Sidebar -->
        <aside class="hidden lg:flex flex-col w-64 border-r border-ink-200 bg-white h-full fixed left-0 top-0 pt-12 px-8 pb-8 z-50">
            <div class="mb-12">
                <h2 class="text-2xl font-bold tracking-tight text-ink-900 flex items-center gap-2">
                    <i data-lucide="store" class="w-6 h-6"></i> Shop
                </h2>
            </div>
            
            <nav class="flex-1 space-y-4">
                <a href="Dashboard.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium tap-effect px-4 py-3 rounded-xl transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>
                <a href="Collections.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium tap-effect px-4 py-3 rounded-xl transition-colors">
                    <i data-lucide="package-check" class="w-5 h-5"></i> Collections
                </a>
                <a href="Settings.html" class="flex items-center gap-3 text-ink-900 font-semibold tap-effect px-4 py-3 bg-ink-200/40 rounded-xl">
                    <i data-lucide="settings" class="w-5 h-5"></i> Store Settings
                </a>
            </nav>

            <button onclick="logout()" class="flex items-center gap-3 text-red-500 hover:bg-red-50 font-medium tap-effect px-4 py-3 rounded-xl transition-colors mt-auto">
                <i data-lucide="log-out" class="w-5 h-5"></i> Sign Out
            </button>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 w-full pb-28 lg:pb-12 pt-8 lg:pt-12 px-0 lg:px-12 relative z-10">
            
            <!-- Mobile Header -->
            <header class="lg:hidden flex items-center justify-between px-6 mb-8 fade-up">
                <div>
                    <p class="text-sm font-medium text-ink-500 mb-0.5">Recycle Shop</p>
                    <h1 class="text-2xl font-bold tracking-tight text-ink-900">Settings</h1>
                </div>
            </header>

            <!-- Desktop Header -->
            <header class="hidden lg:flex items-center justify-between mb-12 fade-up">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight text-ink-900 mb-1">Store Settings</h1>
                    <p class="text-ink-500">Manage your shop details and location.</p>
                </div>
            </header>

            <!-- Main Content Container -->
            <div class="px-6 lg:px-0 space-y-8 fade-up delay-100">

                <!-- Revenue Card -->
                <section class="bg-ink-900 text-white p-8 rounded-3xl shadow-lg relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="flex items-center gap-4 mb-4 relative z-10">
                        <div class="w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center">
                            <i data-lucide="indian-rupee" class="w-6 h-6 text-brand-500"></i>
                        </div>
                        <p class="text-sm font-medium text-white/60 uppercase tracking-wider">Total Revenue</p>
                    </div>
                    <h2 class="text-5xl font-semibold tracking-tight relative z-10">₹<span id="statRevenue">0.00</span></h2>
                    <p class="text-sm text-white/80 mt-2 relative z-10">Earned from aggregator collections</p>
                </section>

                <section class="bg-white lg:p-8 p-6 rounded-3xl border border-ink-200 shadow-sm">
                    <h3 class="text-xl font-semibold tracking-tight mb-6 text-ink-900">Edit Shop Details</h3>
                    
                    <form id="settingsForm" class="space-y-6">
                        <div class="space-y-2">
                            <label class="block text-[11px] font-medium text-ink-500 uppercase tracking-wider">Shop Name (Read Only)</label>
                            <input type="text" id="shopName" readonly class="w-full px-4 py-3 bg-ink-50 border border-ink-200 rounded-xl text-sm text-ink-500 focus:outline-none">
                        </div>

                        <div class="space-y-2">
                            <label class="block text-[11px] font-medium text-ink-500 uppercase tracking-wider">Shop Address</label>
                            <textarea id="shopAddress" rows="3" class="w-full px-4 py-3 bg-white border border-ink-200 rounded-xl text-sm text-ink-900 focus:outline-none focus:border-ink-500 transition-colors" placeholder="Enter full address..."></textarea>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="block text-[11px] font-medium text-ink-500 uppercase tracking-wider">Operating Hours</label>
                                <input type="text" id="operatingHours" class="w-full px-4 py-3 bg-white border border-ink-200 rounded-xl text-sm text-ink-900 focus:outline-none focus:border-ink-500 transition-colors" placeholder="e.g. 9 AM - 6 PM">
                            </div>
                        </div>

                        <div class="border-t border-ink-200 pt-6">
                            <h4 class="text-sm font-semibold text-ink-900 mb-4">Store Location coordinates</h4>
                            <div class="flex items-center gap-4 mb-4">
                                <button type="button" onclick="fetchLocation()" class="bg-ink-200/50 text-ink-900 px-4 py-2.5 rounded-xl text-xs font-semibold tap-effect flex items-center gap-2 hover:bg-ink-200 transition-colors">
                                    <i data-lucide="map-pin" class="w-4 h-4"></i> Auto-fetch Coordinates
                                </button>
                                <span id="locationStatus" class="text-xs text-brand-600 hidden">Location updated!</span>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-[11px] font-medium text-ink-500 uppercase tracking-wider mb-2">Latitude</label>
                                    <input type="text" id="latitude" readonly class="w-full px-4 py-3 bg-ink-50 border border-ink-200 rounded-xl text-sm text-ink-500 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-medium text-ink-500 uppercase tracking-wider mb-2">Longitude</label>
                                    <input type="text" id="longitude" readonly class="w-full px-4 py-3 bg-ink-50 border border-ink-200 rounded-xl text-sm text-ink-500 focus:outline-none">
                                </div>
                            </div>
                        </div>

                        <div class="pt-4">
                            <button type="submit" class="w-full bg-ink-900 text-white rounded-xl py-4 font-semibold shadow-md tap-effect hover:bg-black transition-colors flex justify-center items-center gap-2">
                                <i data-lucide="save" class="w-5 h-5"></i> Save Settings
                            </button>
                        </div>
                    </form>
                </section>
            </div>

        </main>

        <!-- Mobile Bottom Navigation -->
        <nav class="lg:hidden fixed bottom-0 w-full glass-nav pb-safe pt-3 px-6 z-50">
            <div class="flex justify-around items-center w-full max-w-md mx-auto pb-6">
                <a href="Dashboard.html" class="flex flex-col items-center gap-1 tap-effect w-16 group opacity-50">
                    <i data-lucide="home" class="w-6 h-6 text-ink-900"></i>
                    <span class="text-[10px] font-medium text-ink-900">Home</span>
                </a>
                <a href="Collections.html" class="flex flex-col items-center gap-1 tap-effect w-16 group opacity-50">
                    <i data-lucide="package-check" class="w-6 h-6 text-ink-900"></i>
                    <span class="text-[10px] font-medium text-ink-900">Jobs</span>
                </a>
                <div class="relative -top-5">
                    <button onclick="window.location.href='Dashboard.html'" class="w-12 h-12 rounded-full bg-brand-500 text-white flex items-center justify-center shadow-lg tap-effect">
                        <i data-lucide="scan-line" class="w-5 h-5"></i>
                    </button>
                </div>
                <a href="Settings.html" class="flex flex-col items-center gap-1 tap-effect w-16">
                    <i data-lucide="settings" class="w-6 h-6 text-ink-900"></i>
                    <span class="text-[10px] font-semibold text-ink-900">Store</span>
                </a>
            </div>
        </nav>
    </div>

    <script>
        lucide.createIcons();

        async function loadSettings() {
            try {
                const token = localStorage.getItem('ecosure_jwt');
                if (!token) return window.location.href = '../auth.html';

                const response = await fetch('/api/collector/settings', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 401 || response.status === 403) {
                    return window.location.href = '../auth.html';
                }

                const json = await response.json();
                if (json.success) {
                    const data = json.data;
                    document.getElementById('shopName').value = data.shop_name || '';
                    document.getElementById('shopAddress').value = data.shop_address || '';
                    document.getElementById('operatingHours').value = data.operating_hours || '';
                    document.getElementById('latitude').value = data.latitude || '';
                    document.getElementById('longitude').value = data.longitude || '';
                    
                    document.getElementById('statRevenue').textContent = data.total_revenue ? Number(data.total_revenue).toFixed(2) : '0.00';
                }
            } catch (error) {
                console.error(error);
                alert("Failed to load settings.");
            }
        }

        function fetchLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('latitude').value = position.coords.latitude;
                        document.getElementById('longitude').value = position.coords.longitude;
                        document.getElementById('locationStatus').classList.remove('hidden');
                        setTimeout(() => {
                            document.getElementById('locationStatus').classList.add('hidden');
                        }, 3000);
                    },
                    (error) => {
                        alert("Could not fetch location. Please ensure location permissions are granted.");
                    }
                );
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }

        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                shop_address: document.getElementById('shopAddress').value,
                operating_hours: document.getElementById('operatingHours').value,
                latitude: document.getElementById('latitude').value,
                longitude: document.getElementById('longitude').value
            };

            try {
                const token = localStorage.getItem('ecosure_jwt');
                const response = await fetch('/api/collector/settings', {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const json = await response.json();
                if (json.success) {
                    alert("Settings saved successfully!");
                } else {
                    alert("Failed to save settings.");
                }
            } catch (error) {
                console.error(error);
                alert("Connection error.");
            }
        });

        function logout() {
            localStorage.removeItem('ecosure_jwt');
            window.location.href = '../auth.html';
        }

        document.addEventListener('DOMContentLoaded', loadSettings);
    </script>
</body>
</html>
