<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSure - Compliance Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { background: '#FFFFFF', ink: { 900: '#000000', 500: '#86868B', 200: '#E5E5EA' }, brand: { 500: '#00D15E' } } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #FAFAFA; color: #000000; -webkit-font-smoothing: antialiased; }
        .tap-effect:active { transform: scale(0.96); opacity: 0.7; }
        .fade-up { opacity: 0; transform: translateY(12px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-up.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="pb-28 lg:pb-0 lg:bg-[#FAFAFA]">

    <div class="lg:flex lg:max-w-7xl lg:mx-auto lg:h-screen">
        <aside class="hidden lg:flex flex-col w-64 border-r border-ink-200 bg-white h-full fixed left-0 top-0 pt-12 px-8 pb-8 z-50">
            <div class="mb-12"><h2 class="text-2xl font-bold tracking-tight">EcoSure</h2></div>
            <nav class="flex-1 space-y-4">
                <a href="Dashboard.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Overview</a>
                <a href="Traceability.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="scan-barcode" class="w-5 h-5"></i> Traceability</a>
                <a href="Marketplace.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium px-4 py-3 rounded-xl transition-colors"><i data-lucide="shopping-cart" class="w-5 h-5"></i> Marketplace</a>
                <a href="Compliance.html" class="flex items-center gap-3 text-ink-900 font-semibold px-4 py-3 bg-ink-200/40 rounded-xl"><i data-lucide="award" class="w-5 h-5"></i> Compliance</a>
            </nav>
        </aside>

        <main class="lg:ml-64 flex-1 p-6 lg:p-12 min-h-screen">
            <header class="mb-10 fade-up">
                <p class="text-sm font-medium text-ink-500 uppercase tracking-widest mb-1">CPCB Audits</p>
                <h1 class="text-4xl font-semibold tracking-tight">Compliance Portfolio</h1>
            </header>

            <div class="bg-white rounded-3xl border border-ink-200 shadow-sm overflow-hidden fade-up delay-100">
                <div class="p-6 border-b border-ink-200 flex justify-between items-center">
                    <h3 class="font-bold text-lg">My Acquired Certificates</h3>
                    <button class="px-4 py-2 bg-ink-200/50 text-ink-900 rounded-lg text-sm font-medium tap-effect hover:bg-ink-200">
                        Download CPCB Report
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-ink-500 uppercase bg-ink-200/20">
                            <tr>
                                <th class="px-6 py-4 font-semibold tracking-wider">Acquisition Date</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">Recycler</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">Certificate Hash</th>
                                <th class="px-6 py-4 font-semibold tracking-wider">EPR Credits</th>
                            </tr>
                        </thead>
                        <tbody id="complianceList" class="divide-y divide-ink-200">
                            <!-- Injected rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.fade-up').forEach((el, i) => setTimeout(() => el.classList.add('active'), i * 50));
            lucide.createIcons();
            loadCompliance();
        });

        async function loadCompliance() {
            try {
                const token = localStorage.getItem('ecosure_jwt');
                const res = await fetch('/api/manufacturer/compliance', { headers: { 'Authorization': `Bearer ${token}` }});
                const json = await res.json();
                
                const list = document.getElementById('complianceList');
                list.innerHTML = '';
                
                if (json.success && json.data.length > 0) {
                    json.data.forEach(c => {
                        const dateObj = new Date(c.issue_date);
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="px-6 py-4 font-medium text-ink-500">${dateObj.toLocaleDateString()}</td>
                            <td class="px-6 py-4 font-medium">${c.recycler?.facility_name || 'N/A'}</td>
                            <td class="px-6 py-4 font-mono text-xs text-brand-500 font-bold">${c.certificate_hash}</td>
                            <td class="px-6 py-4 font-mono font-semibold">${c.epr_credit_tons} tons</td>
                        `;
                        list.appendChild(row);
                    });
                } else {
                    list.innerHTML = `<tr><td colspan="4" class="px-6 py-12 text-center text-ink-500">You haven't procured any EPR certificates yet. Visit the Marketplace to fulfill your obligation.</td></tr>`;
                }
            } catch (error) {
                console.error(error);
            }
        }
    </script>
</body>
</html>
