<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSure - My Products</title>
    
    <!-- SOTA Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#FFFFFF',
                        ink: {
                            900: '#000000',
                            500: '#86868B',
                            200: '#E5E5EA',
                        },
                        brand: {
                            500: '#00D15E',
                        }
                    },
                    boxShadow: {
                        'glass': '0 -10px 40px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #FFFFFF;
            color: #000000;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        .tap-effect { transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s ease; }
        .tap-effect:active { transform: scale(0.96); opacity: 0.7; }
        .tap-effect:hover { transform: scale(1.02); }

        .fade-up {
            opacity: 0;
            transform: translateY(12px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fade-up.active { opacity: 1; transform: translateY(0); }
        .delay-100 { transition-delay: 50ms; }
        .delay-200 { transition-delay: 100ms; }

        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-top: 0.5px solid rgba(0,0,0,0.08);
        }
    </style>
</head>
<body class="pb-28 lg:pb-0 lg:bg-[#FAFAFA]">

    <!-- Mobile Header -->
    <header class="lg:hidden px-6 pt-12 pb-6 sticky top-0 bg-white/90 backdrop-blur-md z-40 fade-up">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-xs font-medium text-ink-500 uppercase tracking-widest mb-1">Catalog</p>
                <h1 class="text-2xl font-semibold tracking-tight">My Products</h1>
            </div>
            <button class="w-10 h-10 rounded-full bg-ink-900 text-white flex items-center justify-center tap-effect">
                <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <div class="lg:flex lg:max-w-7xl lg:mx-auto lg:h-screen">
        
        <!-- Desktop Sidebar -->
        <aside class="hidden lg:flex flex-col w-64 border-r border-ink-200 bg-white h-full fixed left-0 top-0 pt-12 px-8 pb-8 z-50">
            <div class="mb-12">
                <h2 class="text-2xl font-bold tracking-tight text-brand-500 flex items-center gap-2">
                    <i data-lucide="leaf" class="w-6 h-6"></i> EcoSure
                </h2>
            </div>
            
            <nav class="flex-1 space-y-4">
                <a href="Dashboard.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium tap-effect px-4 py-3 rounded-xl transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>
                <a href="#" class="flex items-center gap-3 text-ink-900 font-semibold tap-effect px-4 py-3 bg-ink-200/40 rounded-xl">
                    <i data-lucide="smartphone" class="w-5 h-5"></i> My Products
                </a>
                <a href="wallet.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium tap-effect px-4 py-3 rounded-xl transition-colors">
                    <i data-lucide="wallet" class="w-5 h-5"></i> Wallet
                </a>
                <a href="map.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium tap-effect px-4 py-3 rounded-xl transition-colors">
                    <i data-lucide="map-pin" class="w-5 h-5"></i> Map
                </a>
            </nav>

            <button onclick="logout()" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium tap-effect px-4 py-3 rounded-xl mt-auto">
                <i data-lucide="log-out" class="w-5 h-5"></i> Logout
            </button>
        </aside>

        <!-- Main Content Area -->
        <main class="lg:ml-64 flex-1 lg:p-12 lg:bg-[#FAFAFA] min-h-screen">
            
            <!-- Desktop Header -->
            <header class="hidden lg:flex justify-between items-center mb-12 fade-up">
                <div>
                    <p class="text-sm font-medium text-ink-500 uppercase tracking-widest mb-1">Catalog</p>
                    <h1 class="text-4xl font-semibold tracking-tight">My Products</h1>
                </div>
                <button class="px-6 py-3 bg-ink-900 text-white rounded-full font-medium shadow-lg hover:bg-black tap-effect flex items-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add Product
                </button>
            </header>

            <div class="px-6 lg:px-0">
                <!-- Registered Products -->
                <section class="fade-up delay-100 bg-white lg:p-8 lg:rounded-3xl lg:border lg:border-ink-200 lg:shadow-sm">
                    
                    <div id="productsContainer" class="flex flex-col">
                        <!-- Empty State -->
                        <div id="emptyProductsState" class="hidden flex flex-col items-center justify-center py-20 text-center">
                            <div class="w-16 h-16 bg-ink-200/30 rounded-2xl flex items-center justify-center mb-4">
                                <i data-lucide="smartphone" class="w-8 h-8 text-ink-500"></i>
                            </div>
                            <h4 class="text-lg font-medium text-ink-900">No products registered</h4>
                            <p class="text-sm text-ink-500 mt-2 max-w-sm">Register your old laptops, phones, and appliances to schedule pickups and earn rewards.</p>
                            
                            <button class="mt-8 px-6 py-3 bg-ink-900 text-white rounded-full font-medium shadow-lg hover:bg-black tap-effect lg:hidden flex items-center gap-2">
                                <i data-lucide="plus" class="w-4 h-4"></i> Add Product
                            </button>
                        </div>
                        
                        <!-- List -->
                        <div id="productsGrid" class="hidden grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                            <!-- JS Injected Items -->
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <!-- Mobile Bottom Navigation (Hidden on Desktop) -->
        <nav class="lg:hidden fixed bottom-0 w-full glass-nav pb-safe pt-3 px-6 z-50">
            <div class="flex justify-between items-center pb-6">
                <button onclick="window.location.href='Dashboard.html'" class="flex flex-col items-center gap-1 tap-effect w-16 group opacity-50">
                    <i data-lucide="layout-dashboard" class="w-6 h-6 text-ink-900"></i>
                    <span class="text-[10px] font-medium text-ink-900">Home</span>
                </button>
                <button class="flex flex-col items-center gap-1 tap-effect w-16 group">
                    <i data-lucide="smartphone" class="w-6 h-6 text-ink-900"></i>
                    <span class="text-[10px] font-semibold text-ink-900">Products</span>
                </button>
                <!-- FAB -->
                <div class="relative -top-5">
                    <button class="w-12 h-12 rounded-full bg-ink-900 text-white flex items-center justify-center shadow-lg tap-effect">
                        <i data-lucide="plus" class="w-6 h-6"></i>
                    </button>
                </div>
                <button onclick="window.location.href='wallet.html'" class="flex flex-col items-center gap-1 tap-effect w-16 group opacity-50">
                    <i data-lucide="wallet" class="w-6 h-6 text-ink-900"></i>
                    <span class="text-[10px] font-medium text-ink-900">Wallet</span>
                </button>
                <button onclick="window.location.href='map.html'" class="flex flex-col items-center gap-1 tap-effect w-16 group opacity-50">
                    <i data-lucide="map-pin" class="w-6 h-6 text-ink-900"></i>
                    <span class="text-[10px] font-medium text-ink-900">Map</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Logic & API Integration -->
    <script>
        // Initialize Icons
        lucide.createIcons();

        // API Fetch Logic (Re-using dashboard endpoint to get user's devices/products)
        async function loadProducts() {
            const token = localStorage.getItem('ecosure_jwt');
            if (!token) {
                window.location.href = '../auth.html';
                return;
            }

            try {
                const response = await fetch('/api/consumer/dashboard', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401 || response.status === 403) {
                    window.location.href = '../auth.html';
                    return;
                }

                const json = await response.json();
                if (json.success) {
                    renderProducts(json.data.devices);
                }
            } catch (err) {
                console.error("Products fetch error:", err);
            }
        }

        function renderProducts(devices) {
            const productsGrid = document.getElementById('productsGrid');
            const emptyProducts = document.getElementById('emptyProductsState');

            if (devices.length === 0) {
                emptyProducts.classList.remove('hidden');
                productsGrid.classList.add('hidden');
            } else {
                emptyProducts.classList.add('hidden');
                productsGrid.classList.remove('hidden');
                productsGrid.innerHTML = '';
                
                devices.forEach(product => {
                    const isRecycled = product.status === 'certificate_issued';
                    productsGrid.innerHTML += `
                        <div class="p-6 border border-ink-200 rounded-2xl hover:border-ink-500 transition-colors bg-white group tap-effect">
                            <div class="flex justify-between items-start mb-6">
                                <div class="w-12 h-12 bg-ink-200/30 rounded-2xl flex items-center justify-center group-hover:bg-ink-200/50 transition-colors">
                                    <i data-lucide="${isRecycled ? 'recycle' : 'smartphone'}" class="w-6 h-6 text-ink-900"></i>
                                </div>
                                ${isRecycled 
                                    ? `<span class="text-xs font-semibold text-brand-500 bg-brand-500/10 px-2.5 py-1 rounded-full">Recycled</span>` 
                                    : `<span class="text-[10px] uppercase tracking-wider font-semibold text-ink-900 border border-ink-900 px-2.5 py-1 rounded-full">${product.status.replace(/_/g, ' ')}</span>`}
                            </div>
                            
                            <h3 class="text-lg font-semibold text-ink-900 capitalize">${product.category.replace(/_/g, ' ')}</h3>
                            <div class="mt-2 space-y-1">
                                <p class="text-sm text-ink-500">Weight: <span class="font-medium text-ink-900">${product.gross_weight_kg} kg</span></p>
                                <p class="text-sm text-ink-500">Manifest: <span class="font-medium text-ink-900">${product.manifest_number}</span></p>
                            </div>
                        </div>
                    `;
                });
                lucide.createIcons(); // Re-init icons
            }

            triggerAnimations();
        }

        function triggerAnimations() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.fade-up').forEach((el) => observer.observe(el));
        }

        function logout() {
            localStorage.removeItem('ecosure_jwt');
            localStorage.removeItem('ecosure_user');
            window.location.href = '../auth.html';
        }

        // Boot
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
