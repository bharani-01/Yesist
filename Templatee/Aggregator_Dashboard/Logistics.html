<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSure - Outbound Logistics</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#FFFFFF',
                        ink: { 900: '#000000', 500: '#86868B', 200: '#E5E5EA' },
                        brand: { 500: '#00D15E' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #FAFAFA; color: #000000; -webkit-font-smoothing: antialiased; }
        .tap-effect:active { transform: scale(0.96); opacity: 0.7; }
        .fade-up { opacity: 0; transform: translateY(12px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-up.active { opacity: 1; transform: translateY(0); }
        .glass-nav { background: rgba(255,255,255,0.85); backdrop-filter: blur(24px); border-top: 0.5px solid rgba(0,0,0,0.08); }
    </style>
</head>
<body class="pb-28 lg:pb-0">

    <div class="lg:flex lg:max-w-7xl lg:mx-auto lg:h-screen">
        
        <aside class="hidden lg:flex flex-col w-64 border-r border-ink-200 bg-white h-full fixed left-0 top-0 pt-12 px-8 pb-8 z-50">
            <div class="mb-12">
                <h2 class="text-2xl font-bold tracking-tight flex items-center gap-2">
                    <div class="w-6 h-6 bg-ink-900 rounded flex items-center justify-center"><div class="w-2 h-2 bg-brand-500 rounded-full"></div></div>
                    EcoSure
                </h2>
            </div>
            <nav class="flex-1 space-y-4">
                <a href="Dashboard.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium tap-effect px-4 py-3 rounded-xl transition-colors"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Overview</a>
                <a href="Inventory.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium tap-effect px-4 py-3 rounded-xl transition-colors"><i data-lucide="boxes" class="w-5 h-5"></i> Inventory</a>
                <a href="Logistics.html" class="flex items-center gap-3 text-ink-900 font-semibold tap-effect px-4 py-3 bg-ink-200/40 rounded-xl"><i data-lucide="truck" class="w-5 h-5"></i> Logistics</a>
                <a href="Reconciliation.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium tap-effect px-4 py-3 rounded-xl transition-colors"><i data-lucide="scale" class="w-5 h-5"></i> Reconciliation</a>
                <a href="Payouts.html" class="flex items-center gap-3 text-ink-500 hover:text-ink-900 font-medium tap-effect px-4 py-3 rounded-xl transition-colors"><i data-lucide="banknote" class="w-5 h-5"></i> Payouts</a>
            </nav>
        </aside>

        <main class="lg:ml-64 flex-1 p-6 lg:p-12 min-h-screen">
            <header class="mb-10 fade-up">
                <p class="text-sm font-medium text-ink-500 uppercase tracking-widest mb-1">Shipment Management</p>
                <h1 class="text-4xl font-semibold tracking-tight">Outbound Logistics</h1>
            </header>

            <div class="bg-white rounded-3xl border border-ink-200 shadow-sm overflow-hidden fade-up delay-100">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-ink-200/30">
                                <th class="p-4 text-xs font-semibold text-ink-500 uppercase tracking-wider border-b border-ink-200">Date Dispatched</th>
                                <th class="p-4 text-xs font-semibold text-ink-500 uppercase tracking-wider border-b border-ink-200">Manifest ID</th>
                                <th class="p-4 text-xs font-semibold text-ink-500 uppercase tracking-wider border-b border-ink-200">Category</th>
                                <th class="p-4 text-xs font-semibold text-ink-500 uppercase tracking-wider border-b border-ink-200">Weight (Net)</th>
                                <th class="p-4 text-xs font-semibold text-ink-500 uppercase tracking-wider border-b border-ink-200">Destination Recycler</th>
                                <th class="p-4 text-xs font-semibold text-ink-500 uppercase tracking-wider border-b border-ink-200">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="6" class="p-8 text-center text-ink-500">Loading logistics data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="lg:hidden fixed bottom-0 w-full glass-nav px-6 pb-8 pt-4 z-50">
        <div class="flex justify-between items-center">
            <a href="Dashboard.html" class="flex flex-col items-center gap-1 text-ink-500 tap-effect">
                <i data-lucide="layout-dashboard" class="w-6 h-6"></i><span class="text-[10px] font-medium">Home</span>
            </a>
            <a href="Inventory.html" class="flex flex-col items-center gap-1 text-ink-500 tap-effect">
                <i data-lucide="boxes" class="w-6 h-6"></i><span class="text-[10px] font-medium">Inventory</span>
            </a>
            <a href="Reconciliation.html" class="flex flex-col items-center gap-1 text-ink-500 tap-effect">
                <i data-lucide="scale" class="w-6 h-6"></i><span class="text-[10px] font-medium">Reconcile</span>
            </a>
            <a href="Payouts.html" class="flex flex-col items-center gap-1 text-ink-500 tap-effect">
                <i data-lucide="banknote" class="w-6 h-6"></i><span class="text-[10px] font-medium">Payouts</span>
            </a>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.fade-up').forEach((el, i) => setTimeout(() => el.classList.add('active'), i * 50));
            lucide.createIcons();
            loadData();
        });

        async function loadData() {
            try {
                const res = await fetch('/api/aggregator/logistics', { headers: { 'Authorization': `Bearer ${localStorage.getItem('ecosure_jwt')}` }});
                const json = await res.json();
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                if (json.data && json.data.length > 0) {
                    json.data.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-ink-200/20 transition-colors border-b border-ink-200 last:border-0';
                        tr.innerHTML = `
                            <td class="p-4 text-sm font-medium whitespace-nowrap">${new Date(item.created_at).toLocaleDateString()}</td>
                            <td class="p-4 text-sm font-mono text-ink-500 whitespace-nowrap">${item.manifest_number}</td>
                            <td class="p-4 text-sm whitespace-nowrap"><span class="px-2 py-1 rounded bg-brand-500/10 text-brand-500 text-xs font-semibold">${item.category.replace(/_/g, ' ').toUpperCase()}</span></td>
                            <td class="p-4 text-sm font-semibold whitespace-nowrap">${item.net_weight_kg} kg</td>
                            <td class="p-4 text-sm font-medium whitespace-nowrap">${item.recycler?.facility_name || 'Unassigned'}</td>
                            <td class="p-4 text-sm whitespace-nowrap"><span class="px-2 py-1 rounded bg-yellow-500/10 text-yellow-600 text-xs font-bold uppercase">In Transit</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-ink-500 font-medium">No active outbound shipments.</td></tr>`;
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
